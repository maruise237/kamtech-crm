services:
  wacrm:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      META_APP_SECRET: ${META_APP_SECRET}
      AUTOMATION_CRON_SECRET: ${AUTOMATION_CRON_SECRET:-}
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-web.rule=Host(`crm.kamtech.online`)
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-web.entrypoints=web
      - traefik.http.services.kamtech-kamtech-crm-k9rezu-31-web.loadbalancer.server.port=3000
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-web.service=kamtech-kamtech-crm-k9rezu-31-web
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-web.middlewares=redirect-to-https@file
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-websecure.rule=Host(`crm.kamtech.online`)
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-websecure.entrypoints=websecure
      - traefik.http.services.kamtech-kamtech-crm-k9rezu-31-websecure.loadbalancer.server.port=3000
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-websecure.service=kamtech-kamtech-crm-k9rezu-31-websecure
      - traefik.http.routers.kamtech-kamtech-crm-k9rezu-31-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
    networks:
      - dokploy-network
      - default
networks:
  dokploy-network:
    external: true
